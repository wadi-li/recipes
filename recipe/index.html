<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Рецепт — кулинарная библиотека</title><link rel="stylesheet" href="../assets/site.css?v=20261116-2"></head><body class="recipe-page"><header><div class="recipe-header-inner"><nav><a href="../">← Все рецепты</a><a href="../menu/">Меню на неделю</a></nav><h1 id="pageTitle">Рецепт</h1></div></header><main id="recipe" aria-live="polite"></main><script src="../assets/recipes-data.js"></script><script src="../assets/recipe-ui.js"></script><script>(function(){const ui=window.RECIPES_UI;const params=new URLSearchParams(location.search);const id=Number(params.get('id'));const r=window.RECIPES_DATA.find(x=>x.id===id);const root=document.getElementById('recipe');if(!r){document.title='Рецепт не найден';root.innerHTML='<section class="panel"><h2>Рецепт не найден</h2><p>Проверьте ссылку или вернитесь в каталог.</p><a href="../">Открыть каталог</a></section>';return}document.title=r.name+' — Рецепты';document.getElementById('pageTitle').textContent=r.name;let ingredients=r.ingredientsStructured?'<table class="recipe-ingredients"><thead><tr><th>Ингредиент</th><th>Количество на '+r.yieldServings+' порции</th></tr></thead><tbody>'+r.ingredientsStructured.map(it=>{const ref=window.RECIPES_INGREDIENTS[it.ingredientId];return '<tr><td>'+ui.esc(ref.name)+'</td><td>'+it.amount+' '+ui.esc(it.unit)+'</td></tr>'}).join('')+'</tbody></table>':'<p>Точная граммовка не указана. Состав: '+ui.esc(r.ingredients)+'.</p>';let n=r.nutrition;let nutrition=n?'<section class="panel"><h2>КБЖУ и клетчатка</h2><table class="recipe-ingredients"><thead><tr><th>Показатель</th><th>На порцию (~'+n.portionG+' г)</th><th>На 100 г</th></tr></thead><tbody>'+['Калории, ккал','Белки, г','Жиры, г','Углеводы, г','Клетчатка, г'].map((name,i)=>'<tr><td>'+name+'</td><td>'+n.perPortion[i]+'</td><td>'+n.per100[i]+'</td></tr>').join('')+'</tbody></table><p class="muted">'+ui.esc(n.basis)+'</p></section>':'<section class="panel"><h2>КБЖУ и клетчатка</h2><p>Не рассчитаны: требуется уточнение состава и массы ингредиентов.</p></section>';root.innerHTML='<img class="recipe-photo" src="'+ui.esc(r.image)+'" alt="Иллюстрация: '+ui.esc(r.name)+'"><section class="panel">'+ui.toggle()+ui.tags(r)+'<h2>Ингредиенты</h2>'+ingredients+'</section><section class="panel"><h2>Приготовление</h2><p>'+ui.esc(r.formula)+'</p>'+(r.section==='супы'?'<p><b>Мультиварка:</b> '+ui.esc(r.multi)+'; <b>скороварка:</b> '+ui.esc(r.pressure)+' под давлением, после набора давления. Соблюдайте правила безопасного сброса.</p>':'')+(r.section==='су-вид'?'<p>Подробные температурные режимы смотрите в <a href="../sous-vide/">справочнике су-вид</a>.</p>':'')+(r.section==='туризм'?'<p>Дополнительные сведения смотрите в <a href="../tourism/">туристическом разделе</a>.</p>':'')+'</section>'+nutrition+'<div class="recipe-print noprint"><button id="printRecipe">Печать / сохранить в PDF</button> <a href="../">← Вернуться к каталогу</a></div>';ui.initToggle();document.getElementById('printRecipe').addEventListener('click',()=>window.print());if(params.get('print')==='1'){window.addEventListener('load',()=>setTimeout(()=>window.print(),350))}})();</script></body></html>
