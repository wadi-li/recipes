<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Салаты — Рецепты</title><link rel="stylesheet" href="../assets/site.css?v=20261116-office"></head><body><header><h1>Салаты</h1><p>Овощные, белковые и лёгкие салаты. КБЖУ и клетчатка рассчитаны по ингредиентам.</p><nav><a href="../">← Все рецепты</a><a href="../salads/">Салаты</a><a href="../office/">Контейнер в офис</a><a href="../menu/">Меню на неделю</a></nav></header><main><section class="panel"><label for="search">Поиск по названию и ингредиентам</label><input id="search" placeholder="Огурец, курица, капуста…"></section><div id="categoryToggle"></div><p id="count" class="muted"></p><section class="cards" id="cards"></section></main><script src="../assets/recipes-data.js"></script><script src="../assets/recipe-ui.js"></script><script>(function(){const ui=window.RECIPES_UI;const recipes=window.RECIPES_DATA.filter(r=>r.section==='салаты');const cards=document.getElementById('cards');const q=document.getElementById('search');document.getElementById('categoryToggle').innerHTML=ui.toggle();ui.initToggle();function draw(){const v=q.value.trim().toLowerCase();const rows=recipes.filter(r=>(r.name+' '+r.ingredients).toLowerCase().includes(v));document.getElementById('count').textContent='Найдено блюд: '+rows.length;cards.innerHTML=rows.map(r=>'<article class="card"><img loading="lazy" src="'+ui.esc(r.image)+'" alt="'+ui.esc(r.name)+'"><div class="inside">'+ui.tags(r)+'<h3>'+ui.esc(r.name)+'</h3><p>'+ui.esc(r.formula)+'</p>'+(r.nutrition?'<div class="nutr"><b>На порцию:</b> '+r.nutrition.perPortion[0]+' ккал · Б '+r.nutrition.perPortion[1]+' · Ж '+r.nutrition.perPortion[2]+' · У '+r.nutrition.perPortion[3]+' · клетчатка '+r.nutrition.perPortion[4]+' г</div>':'')+ui.actions(r,'../')+'</div></article>').join('')||'<p>Совпадений нет.</p>'}q.addEventListener('input',draw);draw()})();</script></body></html>
